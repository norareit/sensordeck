name: Release

on:
  push:
    tags: ["v*"]

# Each job is granted what it needs, so that the job that runs the suite never holds the write token.
permissions: {}

jobs:
  suite:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: suite
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6.3.0
        with:
          version: v2.8.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
